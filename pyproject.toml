[project]
name = "quantum-gpt"
version = "0.1.0"
description = "Quantum-coding LLM R&D workspace: data, eval harness, RL+distill pipeline."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "evals/runs",          # historical run artifacts, do not lint
  "data",                # datasets
  "browser-automation",  # JS not Python
  "_legacy",
  ".benchmarks",
]

[tool.ruff.lint]
# Start conservative: catch real bugs + style that hurts readability.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes (undefined names, unused imports, etc.)
  "W",    # pycodestyle warnings
  "I",    # isort import ordering
  "B",    # bugbear: common footguns
  "UP",   # pyupgrade
]
ignore = [
  "E501",   # line length handled by formatter
  "B008",   # function call in default arg (used for dataclass defaults)
  "B904",   # raise from in except — enable later, noisy now
  "UP007",  # Optional[X] vs X | None — keep py3.10 compat readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests often sys.path hack before imports
"scripts/*" = ["E402"]
"training/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:torch.*",
  "ignore::DeprecationWarning:transformers.*",
]
