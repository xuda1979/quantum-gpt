<script type="text/javascript">
    var app = new Vue({
        el: '.content-box',
        async mounted () {
            this.getHeadIcon();
            this.isH5 = false;
            if(this.isH5){
                setH5FontSize();
                this.getServiceTerms();
                this.get9981ServiceTerms();
            }
            const lastType = window.localStorage.getItem("lastType")
            // 如果没有这段内容，页面进入后呢第一次点击图形验证码输入框会闪烁一下tooltip，后续再点则没有问题
            setTimeout(()=>{
                this.toggleLogin(1);
                setTimeout(()=>{
                    this.toggleLogin(1);
                },100)
            },100)
            
            saveRedirect_uri();
        },
        watch: {
            isPwsLoginType(newValue) {
                window.localStorage.setItem("lastType",newValue);
                this.resetForm();
            },
            'form.password'(){
                this.passwordErrorTip = '';
            },
            'form.username'(){
                this.usernameErrorTip = '';
            },
            'form.captchaCode'(){
                this.captchaCodeErrorTip = '';
            },
            'form.vetifyCode'(newValue){
                this.smsErrorTip = '';
            },
            'form.terms'(newValue){
                console.log('%c [ newValue ]-340', 'font-size:13px; background:pink; color:#bf2c9f;', newValue)
                if(newValue){
                    this.termsTipDisplay = false;
                }
            },
        },
        data(){
            return {
                disabledStyle:{
                    background:'#f0f0f0',
                    color:'#a0a0a0',
                    cursor:'not-allowed'
                },
                agreement:false,
                captchaImgTooltipDisplay:false,
                captchaImgTooltipDisplayTimer:null,
                captchaInputRef:null,
                captchaImg: '', // 图形验证码base64
                captchaId: '', // 图形验证码id
                platformMap,
                platformParams:platformMap.SASAC,
                isH5:false,
                phoneWrongText:"手机号码格式错误",
                codeErrorText:"",
                origin:"phone",
                showPassword: false,
                showErrorMsg:true,
                errorMessage: '',
                freezeSendCodeSeconds: 0,
                isPwsLoginType: false,
                passwordErrorTip:'',
                usernameErrorTip:'',
                captchaCodeErrorTip:'',
                smsErrorTip:'',
                sendButtonText: '获取验证码',
                initSendButtonText: '获取验证码',
                showSendCodeTip:false,
                serviceTermsDisplay:false,
                serviceTermsDisplay9981:false,
                termsTipDisplay:false,
                rememberMe:true,
                form:{
                    captchaCode:"",
                    phoneNumber: '',
                    terms:false,
                    vetifyCode:'',

                    username:'',
                    password:'',
                },
                serviceTermsContent:{
                    pageName:'焕新社区服务协议及隐私政策',
                    pageContent:'',
                },
                serviceTerms9981Content:{
                    pageName:'9981隐私政策',
                    pageContent:'',
                },
                phoneValidator: /^[1](([3][0-9])|([4][0,1,4-9])|([5][0-3,5-9])|([6][2,5,6,7])|([7][0-8])|([8][0-9])|([9][0-3,5-9]))[0-9]{8}$/,
                usernameText: '手机/用户名',
                agreementErrorText:""
            }
        },
        computed:{
            /*
            * 根据端口号区分环境，跳转不同的页面，有端口号为测试环境，否则为生产环境
            */
            agreementPrefix(){
                const redirect_uri = new URLSearchParams(location.search).get('redirect_uri') || sessionStorage.redirectUri;
                if(redirect_uri){
                    return new URL(redirect_uri)?.origin;
                }
                return '';
            },
            testFormData(){
                let flag = false;
                if(this.isPwsLoginType){
                    if(!this.form.password){
                        flag = true;
                        this.passwordErrorTip = '请输入';
                    }
                    if(!this.form.username){
                        flag = true;
                        this.usernameErrorTip = '请输入';
                    }
                }else{
                    if(!this.form.phoneNumber){
                        this.checkPhoneNumber({target:{value:this.form.phoneNumber}});
                        flag = true;
                    }
                    
                    if(!this.form.vetifyCode){
                        this.smsErrorTip = '请输入正确的短信验证码';
                        flag = true;
                    }
                }
                if(this.testCaptchaCodeAndTerms){
                    flag = true;
                }
                return flag;
            },
            testCaptchaCodeAndTerms(){
                this.captchaCodeErrorTip = '';
                this.termsTipDisplay = false;
                let flag = false;
                if(!this.form.terms || !this.form.captchaCode){
                    if(!this.form.terms){
                        this.termsTipDisplay = true;
                    }
                    if(!this.form.captchaCode){
                        this.captchaCodeErrorTip = '请输入正确的图形验证码';
                    }
                    flag = true;
                }
                return flag;
            },
        },
        methods: {
            goBack(){
                window.history.go(-1)
            },
            captchaImgInputBlur(){
                this.captchaImgTooltipDisplayTimer = setTimeout(()=>{
                    this.captchaImgTooltipDisplay = false;
                },100);
            },
            clearCaptchaImgTooltipDisplayTimer(){
                clearTimeout(this.captchaImgTooltipDisplayTimer);
                this.captchaImgTooltipDisplayTimer = null;
            },
            resetForm(){
                this.form = {
                    captchaCode:"",
                    phoneNumber: '',
                    terms:true,
                    vetifyCode:'',
                    password:'',
                };
                this.termsTipDisplay = false;
                this.smsErrorTip = '';
                this.codeErrorText = '';
                this.passwordErrorTip = '';
                this.captchaCodeErrorTip = '';
                this.phoneWrongText = '';
                this.errorMessage = '';
                this.usernameErrorTip = '';
                this.captchaImgTooltipDisplay = false;
            },
            getHeadIcon(){
                const link = document.createElement('link');
                link.rel = 'icon';
                link.href = '/auth/resources/ynuul/login/huanxin-0901-theme/img/favicon.ico';
                document.head.appendChild(link);
            },
            saveRedirect_uri,
            getUrlWithQuery,
            headerImage(){
                return '/auth/resources/ynuul/login/huanxin-0901-theme/img/ai-header-logo.png'
            },
            returnToHome,
            returnToPreviousPage,
            async get9981ServiceTerms(){
                const serviceTerms = (await axios.get('/auth/resources/ynuul/login/huanxin-0901-theme/9981serviceTerm.json')).data.data;
                this.serviceTerms9981Content.pageContent = serviceTerms;
            },
            async getServiceTerms(){
                try{
                    // 此处的url为固定值，不要尝试修改为kc变量！
                    const serviceTermsList = await axios.get(window.location.origin + '/auth/realms/TechnicalMiddlePlatform/themeapi/listPage', {params:{platform:'JTRGZNPTFWXY'}});
                    console.log('%c [ serviceTermsList ]-464', 'font-size:13px; background:pink; color:#bf2c9f;', serviceTermsList)
                    if(serviceTermsList.data.state === 'OK'){
                        let content = '';
                        for(const j in serviceTermsList.data?.body){
                            const _temp = serviceTermsList.data?.body[j];
                            console.log('%c [ _temp ]-423', 'font-size:13px; background:pink; color:#bf2c9f;', _temp)
                            for(const i in _temp?.children){
                                const item = _temp?.children[i];
                                console.log(item)
                                const tempId = item.id;
                                // 此处的url为固定值，不要尝试修改为kc变量！
                                const _serviceTermsContent = await axios.get(window.location.origin + '/auth/realms/TechnicalMiddlePlatform/themeapi/getPage',{ params:{pageId:tempId}});
                                console.log('%c [ _serviceTermsContent ]-476', 'font-size:13px; background:pink; color:#bf2c9f;', _serviceTermsContent)
                                if(_serviceTermsContent.data.state === 'OK'){
                                    content += '<h3 style="margin-top:.5em">' + _serviceTermsContent.data.body.pageName + '</h3>';
                                    content += _serviceTermsContent.data.body.pageContent;
                                }
                            }
                        }
                        this.serviceTermsContent.pageContent = content;
                        console.log('%c [ this.serviceTermsContent ]-481', 'font-size:13px; background:pink; color:#bf2c9f;', this.serviceTermsContent)
                    }
                }catch(err){
                    throw Error(err);
                }
            },
            checkPhoneNumber(e){
                this.showErrorMsg = false;
                const phone = e.target.value;
                const ifValidated=this.phoneValidator.test(phone);
                console.log('%c [ ifValidated ]-476', 'font-size:13px; background:pink; color:#bf2c9f;', ifValidated)
                if(!ifValidated){
                    this.phoneWrongText ="请确保手机号格式正确";
                }else{
                    this.phoneWrongText ="";
                }
            },
            disableSend(seconds) {
                console.log('%c [ seconds ]-330', 'font-size:13px; background:pink; color:#bf2c9f;', seconds)
                if (seconds <= 0) {
                    this.sendButtonText = this.initSendButtonText;
                    this.freezeSendCodeSeconds = 0;
                } else {
                    this.sendButtonText = String(seconds) + '秒后重发';
                    setTimeout(function() {
                        app.disableSend(seconds - 1);
                    }, 1000);
                }
            },
            toggleLogin(type,orign='auto') {
                this.resetForm();
                this.getImgCaptcha();
                this.form.captchaCode = '';
                if(+type===1){
                    this.origin="phone"
                    this.isPwsLoginType = false
                }else{
                    this.origin="password"     
                    this.isPwsLoginType = true
                }
                if(orign==='click'){
                    this.showErrorMsg = false;
                }
                this.captchaCodeErrorTip = '';
            },
            // 获取图形验证码
            async getImgCaptcha(event,showTooltip){
                this.clearCaptchaImgTooltipDisplayTimer();
                if(showTooltip){
                    this.$refs.captchaInputRef.focus();
                }
                try {
                    const res = await axios.get(window.location.origin + '/auth/realms/TechnicalMiddlePlatform/themeapi/captcha')
                    console.log('%c [ res ]-561', 'font-size:13px; background:pink; color:#bf2c9f;', res)
                    this.captchaImg = 'data:image/png;base64,' + res.data.body.captchaData
                    this.captchaId = res.data.body.captchaId;
                    if(ERROR_CODE_MAP.getCaptchaCode.find(x=>x === res.data.errorCode)){
                        this.captchaCodeErrorTip = res.data.errorMessage;
                    }
                } catch (err) {
                    if(err.code >= 500){
                        this.codeErrorText = '系统出错，请联系相应人员'
                    }else{
                        this.codeErrorText = err.response.data
                    }
                }
            },
            async sendVerificationCode() {
                if(!this.agreement){
                    this.agreementErrorText = '确保勾选同意协议'
                    return 
                }
                this.codeErrorText = '';
                this.smsErrorTip = '';
                if(this.testCaptchaCodeAndTerms){return;};
                const phoneNumber = this.form.phoneNumber.trim();
                if (!phoneNumber) {
                    this.errorMessage = 'requirePhoneNumber';
                    document.getElementById('phoneNumber').focus();
                    return;
                }
                if (this.sendButtonText !== this.initSendButtonText) {
                    return;
                }
                const params = new URLSearchParams();
                const publicKey = await this.getPubilcKey();
                params.append('phoneNumber', await getEncodeValue(publicKey,this.form.phoneNumber));
                params.append('captchaCode', this.form.captchaCode);
                params.append('captchaId', this.captchaId);
                params.append('flag', SMSCODE_FLAG_MAP.LOGIN);

                axios
                    .post(window.location.origin + '/auth/realms/TechnicalMiddlePlatform/themeapi/smscode', params)
                    .then(res => {
                        console.log('%c [ res ]-592', 'font-size:13px; background:pink; color:#bf2c9f;', res)
                        if(res.data.errorCode){
                            if(ERROR_CODE_MAP.smsFast.find(x=> x === res.data.errorCode)){
                                res.data.errorMessage = '短信验证码发送过于频繁';
                            }
                            if(ERROR_CODE_MAP.captchaCode.find(x=> x === res.data.errorCode)){
                                this.captchaCodeErrorTip = res.data.errorMessage;
                            }else if(ERROR_CODE_MAP.phoneNumber.find(x=> x === res.data.errorCode)){
                                this.phoneWrongText = res.data.errorMessage;
                            }else{
                                this.smsErrorTip = res.data.errorMessage;
                            }
                            this.getImgCaptcha();
                            app.disableSend(0);
                            return;
                        }
                        app.disableSend(60)
                        console.log('%c [ res ]-357', 'font-size:13px; background:pink; color:#bf2c9f;', res)
                        this.initSendButtonText = '重新获取';
                        setTimeout(()=>{
                            this.showSendCodeTip = true;
                        },1000)
                    }).catch(err => {
                        console.log('%c [ err ]-363', 'font-size:13px; background:pink; color:#bf2c9f;', err)
                        if(err.code >= 500){
                            this.smsErrorTip = '系统出错，请联系相应人员'
                        }else{
                            this.smsErrorTip = err.response.data
                        }
                        app.disableSend(0);
                    }).finally(()=>{
                        setTimeout(()=>{
                            this.showSendCodeTip = false;
                        },3000)
                    })
            },
            async getPubilcKey(){
                try{
                    return getPubilcKeyFromBack('TechnicalMiddlePlatform');
                }catch(err){
                    console.log('%c [ err ]-525', 'font-size:13px; background:pink; color:#bf2c9f;', err)
                    if(err.code >= 500){
                        this.codeErrorText = '系统出错，请联系相应人员'
                    }else{
                        this.codeErrorText = err.response.data
                    }
                    app.disableSend(0)
                    return Promise.reject(err);
                }
            },
            login(needEncrypt = true){
                if(!this.agreement){
                    return
                }
                
                console.log('%c [ this.testFormData ]-707', 'font-size:13px; background:pink; color:#bf2c9f;', this.testFormData)
                if(this.testFormData){return;};
                if(!needEncrypt){
                    const kcFormLogin = document.querySelector('#kc-form-login');
                    let params = {}
                    if(this.isPwsLoginType){
                        params = {
                            username: this.form.username,
                            password: this.form.password,
                            loginType:this.origin
                        }
                    }else{
                        params = {
                            phoneNumber: this.form.phoneNumber,
                            code: this.form.vetifyCode,
                            loginType:this.origin
                        }
                    }
                    if(this.rememberMe){
                        params.rememberMe = 'on';
                    }
                    submitForm(kcFormLogin.action, params, kcFormLogin.method);
                }else{
                    const kcFormLogin = document.querySelector('#kc-form-login');
                    this.getPubilcKey().then(async (publicKey) => {
                        console.log('%c [ publicKey ]-52222284', 'font-size:13px; background:pink; color:#bf2c9f;', publicKey)
                        let params = {}
                        if(this.isPwsLoginType){
                            params = {
                                username: await getEncodeValue(publicKey,this.form.username),
                                password: await getEncodeValue(publicKey,this.form.password),
                                captchaCode:this.form.captchaCode,
                                captchaId:this.captchaId,
                                loginType:this.origin
                            }
                        }else{
                            params = {
                                phoneNumber: await getEncodeValue(publicKey,this.form.phoneNumber),
                                code: await getEncodeValue(publicKey,this.form.vetifyCode),
                                // code: this.form.vetifyCode,
                                captchaCode:this.form.captchaCode,
                                captchaId:this.captchaId,
                                loginType:this.origin
                            }
                            this.checkPhoneNumber({target:{value:this.form.phoneNumber}})           
                            if(!this.form.vetifyCode){
                                this.codeErrorText = '请输入正确的短信验证码'
                            }
                            if(this.ifWrongPhone){
                                return;
                            }
                        }
                        if(this.rememberMe){
                            params.rememberMe = 'on';
                        }
                        console.log('%c [ params ]-605', 'font-size:13px; background:pink; color:#bf2c9f;', params)
                        submitForm(kcFormLogin.action, params, kcFormLogin.method);
                    }).catch(err=>{
                        console.log('%c [ err ]-474', 'font-size:13px; background:pink; color:#bf2c9f;', err)
                        if(err.response.status === 404){
                            this.login(false);
                        }
                    })
                }

            }
        }
    });
</script>
